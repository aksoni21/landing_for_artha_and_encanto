<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Sheet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @page {
      size: 11in 8.5in landscape;
      margin: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: white;
      padding: 0;
      margin: 0;
    }

    .page {
      width: 11in;
      height: 8.5in;
      padding: 0.5in;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 0.3in;
      border-bottom: 3px solid #1e40af;
      padding-bottom: 0.2in;
    }

    .header h1 {
      font-size: 2rem;
      color: #1e3a8a;
      margin-bottom: 0.1in;
    }

    .header p {
      font-size: 1rem;
      color: #6b7280;
      font-style: italic;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid #1e40af;
    }

    th {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      color: #1e3a8a;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.3in;
      border: 2px solid #1e40af;
      text-align: left;
    }

    td {
      padding: 0.25in;
      border: 1px solid #93c5fd;
      height: 0.6in;
      vertical-align: top;
    }

    tr:nth-child(even) {
      background-color: #f9fafb;
    }

    .name-col {
      width: 20%;
    }

    .email-col {
      width: 45%;
    }

    .notes-col {
      width: 35%;
    }

    /* Print-specific styles */
    @media print {
      body {
        padding: 0;
        margin: 0;
      }

      .page {
        margin: 0;
        padding: 0.5in;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>Sign Up Sheet</h1>
      <!-- <p>Please provide your information below</p> -->
    </div>

    <table>
      <thead>
        <tr>
          <th class="name-col">Name</th>
          <th class="email-col">Email</th>
          <th class="notes-col">Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr>

        </tr>
        <tr>

        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
