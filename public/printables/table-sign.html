<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Table Sign - Title III Compliance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0.5in;
    }

    .sign {
      width: 100%;
      max-width: 7.5in;
      height: 10in;
      text-align: center;
      padding: 0.5in 0.75in;
      border: 4px solid #48A9A6;
      background:white ;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
    }

    .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .main-question {
      font-size: 2.75rem;
      font-weight: 700;
      line-height: 1.2;
      color: #48A9A6;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .divider {
      width: 80%;
      height: 4px;
      background: linear-gradient(90deg, transparent 0%, #E76F51 20%, #E76F51 80%, transparent 100%);
      border-radius: 2px;
      margin: 1rem 0;
    }

    .solution {
      font-size: 2rem;
      font-weight: 600;
      color: #E76F51;
      background: white;
      padding: 0.5rem 1rem;
      /* border-radius: 12px; */
      margin-bottom: 1rem;
      /* box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); */
    }

    .cta {
      font-size: 1.5rem;
      font-weight: 500;
      color: #FFFFFF;
      background: #E76F51;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Print-specific styles */
    @page {
      size: letter portrait;
      margin: 0;
    }

    @media print {
      body {
        padding: 0;
        margin: 0;
      }

      .sign {
        box-shadow: none;
        page-break-after: avoid;
        page-break-before: avoid;
        page-break-inside: avoid;
        height: 100vh;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="sign">
    <span class="emoji">🌊</span>
    <h1 class="main-question">Drowning in Title III paperwork?</h1>
    <div class="divider"></div>
    <h2 class="solution">We simplify ELL compliance</h2>
    <p class="cta">Ask me how</p>
  </div>
</body>
</html>
