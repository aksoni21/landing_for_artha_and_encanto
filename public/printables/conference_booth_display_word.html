<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encanto AI - Conference Booth Display</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: white;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 8.5in;
            margin: 0 auto;
            background: white;
            border: 2px solid #333;
            padding: 40px;
            text-align: center;
        }
        
        .logo {
            font-size: 36pt;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .main-headline {
            font-size: 48pt;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .contest-box {
            background: #f39c12;
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            border: 3px solid #e67e22;
        }
        
        .contest-title {
            font-size: 32pt;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .contest-subtitle {
            font-size: 20pt;
            margin-bottom: 20px;
        }
        
        .prize-section {
            background: #27ae60;
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin: 30px 0;
            border: 3px solid #2ecc71;
        }
        
        .prize-title {
            font-size: 28pt;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .prize-features {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 10px;
            flex: 1;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .feature-title {
            font-weight: bold;
            font-size: 16pt;
            margin-bottom: 10px;
        }
        
        .feature-desc {
            font-size: 14pt;
        }
        
        .contact-info {
            background: #34495e;
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 30px;
            border: 3px solid #2c3e50;
        }
        
        .contact-title {
            font-weight: bold;
            font-size: 20pt;
            margin-bottom: 15px;
        }
        
        .contact-details {
            font-size: 16pt;
            line-height: 1.8;
        }
        
        .contact-details strong {
            color: #f39c12;
        }
        
        /* Print styles */
        @media print {
            body {
                background: white;
                color: black;
            }
            
            .container {
                border: 3px solid #333;
                box-shadow: none;
            }
            
            .contest-box, .prize-section, .contact-info {
                border: 3px solid #333;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎯 Encanto AI</div>
        
        <div class="main-headline">WIN A 3-MONTH FREE DEMO!</div>
        
        <div class="contest-box">
            <div class="contest-title">🎓 Teacher & Administrator Special</div>
            <div class="contest-subtitle">Transform Your ESL Classroom with Speaking based AI</div>
        </div>
        
        <div class="prize-section">
            <div class="prize-title">🏆 WIN: 3-Month Free Pilot</div>
            <div class="prize-features">
                <div class="feature">
                    <div class="feature-title">📊 Teacher Dashboard</div>
                    <div class="feature-desc">Automated assessments + student analytics</div>
                </div>
                <div class="feature">
                    <div class="feature-title">📋 Title III Compliance</div>
                    <div class="feature-desc">Automated federal reporting</div>
                </div>
            </div>
        </div>
<!--         
        <div class="contact-info">
            <div class="contact-title">📞 Try It Now!</div>
            <div class="contact-details">
                <strong>Watch Title III demo</strong><br>
                <strong>Try teacher dashboard</strong><br>
                <strong>Email:</strong> ankur.soni@encantospeak.com
            </div>
        </div> -->
    </div>
</body>
</html>
